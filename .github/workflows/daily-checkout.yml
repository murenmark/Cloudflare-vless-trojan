name: daily checkout
on:
  schedule:
    - cron: "30 22 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge upstream yonggekkk/Cloudflare-vless-trojan into main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout main
          git remote add upstream https://github.com/yonggekkk/Cloudflare-vless-trojan.git
          git fetch --no-tags upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "daily checkout: already current"
          else
            git merge --no-edit -m "daily checkout: sync upstream $(date -u +%F)" upstream/main
            git push origin HEAD:main
            echo "daily checkout: merged upstream $(git rev-parse --short upstream/main)"
          fi
