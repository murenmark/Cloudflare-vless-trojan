name: daily checkout
on:
  schedule:
    - cron: "30 22 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Merge upstream (yonggekkk/Cloudflare-vless-trojan)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          br=$(gh api "repos/$REPO" --jq .default_branch)
          out=$(gh api --method PUT -H "Content-Type: application/json" -f branch="$br" "repos/$REPO/merge-upstream" 2>&1) || {
            if echo "$out" | grep -qiE "already up to date|non-fast-forward"; then
              echo "upstream sync: already current"
            else
              echo "$out"; exit 1
            fi
          }
          echo "upstream merged: $(echo "$out" | head -c 200)"
